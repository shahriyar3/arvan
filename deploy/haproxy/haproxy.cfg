global
    log stdout format raw daemon
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend api_front
    bind *:8080
    default_backend api_back

backend api_back
    balance roundrobin
    option httpchk GET /health/ready
    http-check expect status 200
    server api1 api-1:8080 check inter 5s fall 3 rise 2
    server api2 api-2:8080 check inter 5s fall 3 rise 2
