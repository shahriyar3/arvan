services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
      POSTGRES_DB: sms_gateway
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms -d sms_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: sms
      RABBITMQ_DEFAULT_PASS: sms
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mock-operator:
    build:
      context: .
      dockerfile: Dockerfile
      target: mock-operator
    environment:
      MOCK_OPERATOR_HOST: 0.0.0.0
      MOCK_OPERATOR_PORT: 8090
      MOCK_OPERATOR_MIN_LATENCY: 10ms
      MOCK_OPERATOR_MAX_LATENCY: 50ms
      MOCK_OPERATOR_FAILURE_RATE: 0
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
