services:
  postgres-primary:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - hot_standby=on
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_connections=200
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
      POSTGRES_DB: sms_gateway
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator
    ports:
      - "5433:5432"
    volumes:
      - pgprimary:/var/lib/postgresql/data
      - ./deploy/postgres/primary/init-replication.sh:/docker-entrypoint-initdb.d/10-init-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms -d sms_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-replica:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
      POSTGRES_DB: sms_gateway
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator
    ports:
      - "5434:5432"
    volumes:
      - pgreplica:/var/lib/postgresql/data
      - ./deploy/postgres/replica/entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["/replica-entrypoint.sh"]
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms -d sms_gateway"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: sms
      RABBITMQ_DEFAULT_PASS: sms
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      worker:
        condition: service_started
      outbox-relay:
        condition: service_started

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  mock-operator:
    build:
      context: .
      dockerfile: Dockerfile
      target: mock-operator
    environment:
      MOCK_OPERATOR_HOST: 0.0.0.0
      MOCK_OPERATOR_PORT: 8090
      MOCK_OPERATOR_MIN_LATENCY: 10ms
      MOCK_OPERATOR_MAX_LATENCY: 50ms
      MOCK_OPERATOR_FAILURE_RATE: 0
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment: &api_env
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      DATABASE_PRIMARY_DSN: postgres://sms:sms@postgres-primary:5432/sms_gateway?sslmode=disable
      DATABASE_REPLICA_DSN: postgres://sms:sms@postgres-replica:5432/sms_gateway?sslmode=disable
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://sms:sms@rabbitmq:5672/
      OPERATOR_BASE_URL: http://mock-operator:8090
      RATE_LIMIT_ENABLED: "true"
      TELEMETRY_ENABLED: "true"
      TELEMETRY_OTLP_ENDPOINT: jaeger:4318
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment: *api_env
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  haproxy:
    image: haproxy:2.9-alpine
    volumes:
      - ./deploy/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8080:8080"
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy

  outbox-relay:
    build:
      context: .
      dockerfile: Dockerfile
      target: outbox-relay
    environment:
      DATABASE_PRIMARY_DSN: postgres://sms:sms@postgres-primary:5432/sms_gateway?sslmode=disable
      RABBITMQ_URL: amqp://sms:sms@rabbitmq:5672/
      TELEMETRY_ENABLED: "true"
      TELEMETRY_OTLP_ENDPOINT: jaeger:4318
      OUTBOX_RELAY_METRICS_PORT: 9092
    ports:
      - "9092:9092"
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      DATABASE_PRIMARY_DSN: postgres://sms:sms@postgres-primary:5432/sms_gateway?sslmode=disable
      RABBITMQ_URL: amqp://sms:sms@rabbitmq:5672/
      OPERATOR_BASE_URL: http://mock-operator:8090
      WORKER_METRICS_PORT: 9091
      TELEMETRY_ENABLED: "true"
      TELEMETRY_OTLP_ENDPOINT: jaeger:4318
    ports:
      - "9091:9091"
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mock-operator:
        condition: service_healthy
      jaeger:
        condition: service_healthy

volumes:
  pgprimary:
  pgreplica:
